name: Isolated formal JeezLabs repair verification
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: isolated-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event.repository.id == 1300629887 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/remove-injected-loaders-20261107-01a1b426'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: false
      - name: Capture genuine fonts without app source, then run existing JeezLabs checks offline
